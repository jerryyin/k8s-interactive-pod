apiVersion: v1
kind: Pod
metadata:
  name: {{POD_NAME}}
  labels:
    app: interactive-ssh
spec:
  volumes:
    - name: home-vol
      emptyDir:
        sizeLimit: 10Gi
    - name: persistent-vol
      persistentVolumeClaim:
        claimName: {{PVC_CLAIM_NAME}}
    - name: ssh-key
      secret:
        secretName: {{SSH_SECRET_NAME}}
  securityContext:
    fsGroup: 1001
  containers:
    - name: dev-container
      image: {{DOCKER_IMAGE}}
      imagePullPolicy: IfNotPresent
      command:
        - /bin/bash
        - -c
        - |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          ESSENTIAL_PACKAGES="sudo openssh-server curl git"
          
          install_packages() {
            apt-get install -y --no-install-recommends $ESSENTIAL_PACKAGES
          }
          
          # Fast path: try installing without refresh first
          if ! install_packages >/tmp/apt-install.log 2>&1; then
              echo "Initial package install failed, refreshing apt cache (this may take a while)..."
              cat /tmp/apt-install.log || true
              rm -f /tmp/apt-install.log
              apt-get update -qq
              install_packages
          fi
          rm -f /tmp/apt-install.log || true
          
          # Create user with uid 1001 (matching fsGroup)
          useradd -u 1001 -m -s /bin/bash {{USERNAME}} || true
          
          # Grant sudo privileges
          echo '{{USERNAME}} ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/{{USERNAME}}
          chmod 0440 /etc/sudoers.d/{{USERNAME}}
          
          # Setup SSH access
          chmod 755 /home/{{USERNAME}}
          chown {{USERNAME}}:{{USERNAME}} /home/{{USERNAME}}
          
          mkdir -p /home/{{USERNAME}}/.ssh
          cp /mnt/sshkey/authorized_keys /home/{{USERNAME}}/.ssh/authorized_keys
          chmod 700 /home/{{USERNAME}}/.ssh
          chmod 600 /home/{{USERNAME}}/.ssh/authorized_keys
          chown -R {{USERNAME}}:{{USERNAME}} /home/{{USERNAME}}/.ssh
          
          # Start SSH daemon
          mkdir -p /var/run/sshd
          /usr/sbin/sshd -D
      tty: true
      stdin: true
      volumeMounts:
        - name: home-vol
          mountPath: /home/{{USERNAME}}
          readOnly: false
        - name: persistent-vol
          mountPath: /{{USERNAME}}
          readOnly: false
        - name: ssh-key
          mountPath: /mnt/sshkey
          readOnly: true
      resources:
        limits:
          amd.com/gpu: 1

